name: Update homepage stats

on:
  schedule:
    - cron: '17 7 1 * *' # 07:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "::error::Repository secret POSTHOG_API_KEY is missing. Add a PostHog personal API key with the query:read scope (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Read PostHog and update stats
        run: node scripts/update-stats.mjs

      # The marketing site only: SKIP_SHARE=1 needs no app .env, no pnpm and no
      # clone of recordseek-app (share/ and sdk/ are left untouched).
      - name: Rebuild marketing site
        run: SKIP_SHARE=1 scripts/release.sh

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          through="$(node -p "require('./web/src/data/stats.json').through.slice(0, 7)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/src/data/stats.json metrics .
          git commit -m "Update homepage stats through $through"
          git push origin HEAD:site
